<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bookly">
<meta name="description" content="Remember the key ideas from the books you read.">

<link rel="icon" type="image/png" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Bookly</title>
<style>
@font-face { font-family: "Instrument Sans"; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/instrument-sans-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Instrument Sans"; font-style: normal; font-weight: 500; font-display: swap; src: url(fonts/instrument-sans-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "Instrument Sans"; font-style: normal; font-weight: 600; font-display: swap; src: url(fonts/instrument-sans-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Instrument Sans"; font-style: normal; font-weight: 700; font-display: swap; src: url(fonts/instrument-sans-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: "Literata"; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/literata-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Literata"; font-style: normal; font-weight: 500; font-display: swap; src: url(fonts/literata-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "Literata"; font-style: normal; font-weight: 600; font-display: swap; src: url(fonts/literata-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Literata"; font-style: italic; font-weight: 400; font-display: swap; src: url(fonts/literata-latin-400-italic.woff2) format("woff2"); }
html, body { margin: 0; }
body { overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
/* Layout: one phone-width column with a bottom tab bar; Today is tinted with the current book's palette and motif; review is a full-screen overlay. Single dark look, per the approved Bookly design. */
:root {
  --bg: #141318;
  --raised: #211F26;
  --nav: #19181D;
  --line: #2E2C33;
  --line-strong: #3A3D44;
  --fg: #ECEAF0;
  --fg-warm: #F3F1EC;
  --muted: #A6A3AD;
  --muted-2: #B9B6C0;
  --card: #1C3354;
  --card-line: #2E4568;
  --card-muted: #B7C3D6;
  --green: #467D55;
  --green-text: #8CC79C;
  --blue: #3F6496;
  --orange: #A9622F;
  --red: #B5484A;
  --tile-new: #3A3D44;
  --tile-new-fg: #D5D8DD;
  --display: "Literata", Georgia, "Times New Roman", serif;
  --ui: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--ui); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; transition: background-color 0.3s; }
* { box-sizing: border-box; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--green-text); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.app { max-width: 520px; margin: 0 auto; min-height: 100%; position: relative; }
.motif { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.motif svg { width: 100%; height: 100%; max-width: 520px; display: block; margin: 0 auto; }
.screen { position: relative; z-index: 1; padding-inline: 16px; padding-block: 24px 112px; display: flex; flex-direction: column; gap: 14px; }
h1.page { margin: 0; font-family: var(--display); font-size: 26px; font-weight: 600; text-wrap: balance; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
.num { font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; }
.grow { flex: 1; min-width: 0; }

/* Today */
.today { color: var(--fg-warm); }
.brandrow { display: flex; justify-content: space-between; align-items: center; }
.brand { font-family: var(--display); font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.greet { margin: 0; font-family: var(--display); font-size: 30px; font-weight: 500; line-height: 1.15; letter-spacing: -0.01em; }
.glass { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.bignum { font-family: var(--display); font-size: 52px; font-weight: 500; line-height: 0.9; }
.mixbar { display: flex; gap: 3px; height: 10px; }
.mixbar span { border-radius: 999px; min-width: 6px; }
.mixlegend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: #DAD7E0; }
.mixlegend span { display: inline-flex; align-items: center; gap: 6px; }
.mixlegend i { width: 8px; height: 8px; border-radius: 999px; display: inline-block; }
.btn-soft { display: flex; justify-content: center; align-items: center; gap: 8px; min-height: 52px; border-radius: 14px; background: var(--soft); color: var(--ink); font-size: 16px; font-weight: 700; border: 0; width: 100%; }
.week { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.weekgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.dot { width: 30px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.08); }
.dot.done { background: var(--soft); color: var(--ink); }
.dot.today { background: transparent; border: 2px dashed var(--soft); }
.daylabel { font-size: 11px; font-weight: 500; color: var(--muted); }
.daylabel.today { font-weight: 700; color: var(--soft); }
.nowcard { display: flex; flex-direction: column; border-radius: 18px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); color: var(--fg-warm); background: none; padding: 0; text-align: left; width: 100%; }
.nowhead { background: var(--deep); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.nowbody { background: rgba(20,19,24,0.72); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.minitiles { display: grid; gap: 4px; }
.minitiles span { aspect-ratio: 1; border-radius: 4px; }
.chip-soft { font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: var(--soft); color: var(--ink); white-space: nowrap; }
.warm { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; border: 1.5px dashed rgba(255,255,255,0.22); color: var(--fg-warm); background: none; width: 100%; text-align: left; }
.warm .q { font-family: var(--display); font-style: italic; font-size: 15px; line-height: 1.3; }
.pillbtn { font-size: 13px; font-weight: 700; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.10); white-space: nowrap; }

/* Shared blocks */
.panel { background: var(--raised); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.statgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--raised); border-radius: 12px; padding: 10px 12px; }
.stat b { display: block; font-size: 18px; font-weight: 600; }
.stat span { font-size: 12px; color: var(--muted); }
.btn { border: 0; border-radius: 14px; min-height: 50px; padding: 0 16px; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn-green { background: var(--green); color: #fff; }
.btn-outline { background: transparent; border: 1px solid var(--line-strong); color: var(--fg); }
.iconbtn { width: 44px; height: 44px; border: 0; background: transparent; color: var(--fg); display: flex; align-items: center; justify-content: center; border-radius: 12px; flex-shrink: 0; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--fg); font-weight: 500; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #fff; font-weight: 600; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.s-new { background: var(--tile-new); color: var(--tile-new-fg); }
.s-learning { background: var(--orange); color: #fff; }
.s-reviewing { background: var(--blue); color: #fff; }
.s-mastered { background: var(--green); color: #fff; }
.libbook { border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; background: var(--raised); }
.libhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; border: 0; width: 100%; text-align: left; background: var(--green); color: #fff; }
.libhead.idle { background: #2A2830; color: var(--fg); }
.libhead .t { font-size: 15px; font-weight: 700; }
.libhead .a { font-size: 13px; opacity: 0.9; }
.darkchip { font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: rgba(0,0,0,0.18); white-space: nowrap; }
.numtiles { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; padding: 10px 12px; }
.numtiles span { height: 26px; display: flex; align-items: center; justify-content: center; border-radius: 6px; font-weight: 600; font-size: 11px; }
.coming { padding: 10px 14px 12px; font-size: 13px; color: var(--muted); }
.list { display: flex; flex-direction: column; gap: 6px; }
details.pt { background: var(--raised); border-radius: 12px; }
details.pt summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 8px; min-height: 52px; cursor: pointer; }
details.pt summary::-webkit-details-marker { display: none; }
.ptile { width: 36px; height: 36px; flex-shrink: 0; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }
.ptcue { flex: 1; min-width: 0; font-family: var(--display); font-size: 15px; line-height: 1.3; }
.ptnext { font-size: 12px; color: var(--muted); white-space: nowrap; }
details.pt .body { padding: 0 14px 14px 56px; display: flex; flex-direction: column; gap: 8px; }
details.pt .body p { margin: 0; font-family: var(--display); line-height: 1.55; font-size: 15px; }
.also { font-size: 13px; color: var(--card-muted); font-style: italic; }
.linkbtn { background: none; border: 0; color: var(--green-text); font-weight: 600; padding: 6px 0; text-align: left; font-size: 14px; }
.cover { width: 64px; height: 90px; border-radius: 6px; background: var(--card); flex-shrink: 0; display: flex; align-items: flex-end; padding: 6px; font-family: var(--display); font-size: 10px; line-height: 1.2; color: var(--card-muted); overflow: hidden; }
.jrow { display: flex; align-items: center; gap: 12px; background: var(--raised); border-radius: 14px; padding: 12px 14px; color: var(--fg); border: 0; width: 100%; text-align: left; }
.badge { width: 32px; height: 32px; flex-shrink: 0; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; }
.bar { height: 6px; background: var(--tile-new); border-radius: 3px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--green); }
.stack { display: flex; height: 14px; gap: 3px; }
.stack span { border-radius: 4px; }
.empty { padding: 28px 20px; border: 1px dashed var(--line); border-radius: 18px; display: flex; flex-direction: column; gap: 10px; }
.empty h2 { font-family: var(--display); font-size: 20px; margin: 0; font-weight: 600; }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .lbl { font-size: 13px; color: var(--muted); }
.field input, .field textarea, .field select { min-height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--raised); color: var(--fg); padding: 0 14px; width: 100%; }
.field textarea { padding: 10px 12px; font-family: var(--display); line-height: 1.45; resize: vertical; min-height: 110px; }
.ptbox { display: flex; flex-direction: column; gap: 10px; background: var(--raised); border-radius: 16px; padding: 14px; }
.ptbox .field input, .ptbox .field textarea { background: var(--bg); border-radius: 10px; }
.tabs2 { display: flex; background: var(--raised); border-radius: 12px; padding: 4px; }
.tabs2 button { min-height: 36px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-weight: 500; font-size: 14px; }
.tabs2 button[aria-selected="true"] { background: var(--green); color: #fff; font-weight: 600; }
.radio { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px; }
.radio input { width: 20px; height: 20px; accent-color: var(--green); }
.dashedbtn { min-height: 44px; border-radius: 10px; border: 1px dashed var(--line-strong); background: transparent; color: var(--fg); font-weight: 500; font-size: 14px; }
.seg { display: flex; background: var(--bg); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 9px; min-height: 38px; color: var(--muted); font-weight: 600; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--green); color: #fff; }

/* Nav */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--nav); border-top: 1px solid var(--line); padding: 8px 0 calc(20px + env(safe-area-inset-bottom, 0px)); transition: background-color 0.3s; }
nav.tabs.tinted { background: rgba(20,19,24,0.88); border-top-color: rgba(255,255,255,0.08); }
nav.tabs .inner { max-width: 520px; margin: 0 auto; display: flex; justify-content: space-around; }
nav.tabs button { background: none; border: 0; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; min-width: 64px; min-height: 44px; }
nav.tabs button[aria-current="page"] { color: var(--active, var(--green-text)); font-weight: 600; }
nav.tabs svg { width: 24px; height: 24px; }

/* Review */
.review { position: fixed; inset: 0; background: var(--bg); z-index: 10; display: flex; }
.review .wrap { max-width: 520px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; padding-inline: 16px; padding-block: calc(20px + env(safe-area-inset-top, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)); min-height: 0; }
.rvtop { display: flex; align-items: center; gap: 12px; }
.rvtop .iconbtn { color: var(--muted); }
.prog { flex: 1; height: 6px; background: #2A2830; border-radius: 3px; overflow: hidden; }
.prog span { display: block; height: 100%; background: var(--green); transition: width 0.25s; }
.pill { font-size: 13px; padding: 6px 12px; border-radius: 999px; background: var(--raised); color: var(--fg); }
.kind { font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 999px; color: #fff; }
.kind.rev { background: var(--blue); }
.kind.new { background: var(--green); }
.flash { flex: 1; min-height: 0; background: var(--card); border-radius: 24px; padding: 28px 24px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; color: var(--fg); border: 0; text-align: left; width: 100%; }
.flash.prompt { justify-content: center; }
.flash .eyebrow { color: var(--card-muted); font-size: 13px; font-weight: 600; }
.cue { margin: 0; font-family: var(--display); font-size: 26px; line-height: 1.35; font-weight: 500; text-wrap: balance; }
.revealed { padding: 24px; gap: 18px; }
.cuesmall { font-family: var(--display); font-size: 16px; line-height: 1.4; color: var(--card-muted); margin: 0; }
.divider { height: 1px; background: var(--card-line); flex-shrink: 0; }
.point { margin: 0; font-family: var(--display); font-size: 20px; line-height: 1.55; }
.cardfoot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--card-muted); }
.cardfoot .iconbtn { color: var(--card-muted); }
.cardfoot .iconbtn[aria-pressed="true"] { color: #F1E4C0; }
.showbtn { display: flex; justify-content: center; align-items: center; min-height: 56px; border-radius: 16px; border: 1px solid var(--line-strong); color: var(--fg); font-size: 16px; font-weight: 600; background: none; width: 100%; }
.left { display: flex; justify-content: center; font-size: 13px; color: var(--muted); }
.grades { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grade { border: 0; border-radius: 16px; min-height: 68px; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.grade b { font-size: 17px; }
.grade span { font-size: 13px; font-weight: 500; }
.grade.forgot { background: var(--red); }
.grade.rem { background: var(--green); }
.btn-next { border: 0; border-radius: 16px; min-height: 68px; width: 100%; background: var(--green); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.btn-next b { font-size: 17px; }
.btn-next span { font-size: 13px; opacity: 0.9; }
.done { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; }

.sheet-bg { position: fixed; inset: 0; background: rgba(5,5,8,0.6); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--nav); border-radius: 22px 22px 0 0; width: 100%; max-width: 520px; padding-inline: 16px; padding-block: 18px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; max-height: 92%; overflow-y: auto; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); }
.screen { padding-top: calc(24px + env(safe-area-inset-top, 0px)); }
.brandmark { display: flex; align-items: center; gap: 10px; }
.brandmark img { width: 34px; height: 27px; display: block; }
</style>
</head>
<body>

<div class="motif" id="motif" aria-hidden="true"></div>
<div class="app">
  <main class="screen" id="screen"><div class="empty"><h2>Loading your library</h2><p class="muted">Your books and points are on their way.</p></div></main>
</div>
<nav class="tabs" id="nav" aria-label="Main">
  <div class="inner">
    <button data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="7" width="16" height="13" rx="2"/><path d="M7 3.5h10"/></svg>Today</button>
    <button data-tab="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="4" height="16" rx="1"/><rect x="9" y="4" width="4" height="16" rx="1"/><path d="M15 6.5l3.3-1 3.4 13.4-3.3 1z"/></svg>Library</button>
    <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20v-8M11 20V5M17 20v-5M3 20h18"/></svg>Progress</button>
    <button data-tab="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Add</button>
  </div>
</nav>
<div id="overlay"></div>

<script src="localdb.js"></script>
<script>
(function () {
  "use strict";

  /* ---------- FSRS-6 scheduler (default parameters, 90% target retention) ---------- */
  var W = [0.212, 1.2931, 2.3065, 8.2956, 6.4133, 0.8334, 3.0194, 0.001, 1.8722, 0.1666, 0.796, 1.4835, 0.0614, 0.2629, 1.6483, 0.6014, 1.8729, 0.5425, 0.0912, 0.0658, 0.1542];
  var DECAY = -W[20], FACTOR = Math.pow(0.9, 1 / DECAY) - 1, RETENTION = 0.9;
  var DAY = 86400000, MASTERED_DAYS = 21;
  function clamp(x, a, b) { return Math.min(b, Math.max(a, x)); }
  function retrievability(t, s) { return Math.pow(1 + FACTOR * t / s, DECAY); }
  function intervalDays(s) { return (s / FACTOR) * (Math.pow(RETENTION, 1 / DECAY) - 1); }
  function initD(g) { return clamp(W[4] - Math.exp(W[5] * (g - 1)) + 1, 1, 10); }
  function nextD(d, g) { var dp = d + (-W[6] * (g - 3)) * (10 - d) / 9; dp = W[7] * initD(4) + (1 - W[7]) * dp; return clamp(dp, 1, 10); }
  function sSuccess(d, s, r) { return s * (Math.exp(W[8]) * (11 - d) * Math.pow(s, -W[9]) * (Math.exp(W[10] * (1 - r)) - 1) + 1); }
  function sFail(d, s, r) { var sf = W[11] * Math.pow(d, -W[12]) * (Math.pow(s + 1, W[13]) - 1) * Math.exp(W[14] * (1 - r)); return Math.min(sf, s / Math.exp(W[17] * W[18])); }
  function sShort(s, g) { var inc = Math.exp(W[17] * (g - 3 + W[18])) * Math.pow(s, -W[19]); if (g >= 3) inc = Math.max(inc, 1); return s * inc; }

  /* ---------- Review session ----------

  function startSession(mode, opts) {

  function parseCSV(text) {

      else if (ch === '"') q = true;
      else if (ch === ",") { row.push(f); f = ""; }
      else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }

  function readRange(tab, range) {
    var url = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:csv&headers=1&sheet=" + encodeURIComponent(tab) + "&range=" + range + "&t=" + Date.now();
    return fetch(url, { cache: "no-store", credentials: "omit" }).then(function (r) {
      if (!r.ok) throw { code: r.status === 404 ? "not_found" : "private" };
      return r.text();
    }, function () { throw { code: navigator.onLine === false ? "offline" : "private" }; }).then(function (t) {
      if (/^\s*</.test(t)) throw { code: "private" };
      return parseCSV(t);
    });
  }
  function syncError(e) {
    var c = e && e.code;
    if (c === "offline") return "You're offline. Connect to the internet, then try again.";
    if (c === "not_found") return "Couldn't find the Sheet. Check it still exists.";
    if (c === "private") return "Bookly couldn't read your Sheet. In Google Sheets, tap Share, set General access to Anyone with the link (Viewer), then try again.";
    return "Couldn't reach Google Sheets. Try again in a moment.";
  }
  function cell(r, i) { return String((r && r[i]) == null ? "" : r[i]).trim(); }
  function computeSync(bookRows, cardRows) {
    var ops = [], lines = [], sum = { booksNew: 0, booksChanged: 0, cardsNew: 0, cardsChanged: 0, cardsDropped: 0, skipped: 0 };
    var byTitle = {}, touched = {};
    bookRows.slice(1).forEach(function (r) {
      var title = cell(r, 1); if (!title) return;
      var id = slug(title), cur = S.books[id], ord = parseFloat(cell(r, 9));
      byTitle[title.toLowerCase()] = id;
      if (touched["books/" + id]) return; touched["books/" + id] = 1;
      var next = { title: title, author: cell(r, 2), category: cell(r, 3), read: cell(r, 7) };
      if (isFinite(ord) && !(cur && cur.orderLocal)) next.order = ord;
      if (!cur) {
        ops.push({ path: "books/" + id, data: Object.assign({ id: id, order: 9999, custom: false }, next) });
        sum.booksNew++; lines.push("New book: " + title);
      } else {
        var ch = Object.keys(next).filter(function (k) { return String(cur[k] == null ? "" : cur[k]) !== String(next[k]); });
        if (ch.length) { ops.push({ path: "books/" + id, data: Object.assign({}, cur, next) }); sum.booksChanged++; lines.push(title + ": " + ch.join(", ") + " changed"); }
      }
    });
    cardRows.slice(1).forEach(function (r) {
      var title = cell(r, 2), n = parseInt(cell(r, 3), 10); if (!title || !isFinite(n)) return;
      var bid = byTitle[title.toLowerCase()] || slug(title), id = bid + "-" + String(n).padStart(2, "0"), cur = S.cards[id];
      if (touched["cards/" + id]) return; touched["cards/" + id] = 1;
      if (/^drop/i.test(cell(r, 7))) {
        if (cur) { ops.push({ path: "cards/" + id, del: true }); if (S.progress[id]) ops.push({ path: "progress/" + id, del: true }); sum.cardsDropped++; lines.push("Remove: " + title + ", point " + n); }
        return;
      }
      var cue = cell(r, 4), point = cell(r, 5), also = cell(r, 6);
      if (!cue || !point) return;
      if (!S.books[bid] && !touched["books/" + bid]) { sum.skipped++; return; }
      if (!cur) { ops.push({ path: "cards/" + id, data: { id: id, bookId: bid, n: n, cue: cue, point: point, also: also, custom: false } }); sum.cardsNew++; lines.push("New card: " + title + ", point " + n); }
      else if (cur.cue !== cue || cur.point !== point || (cur.also || "") !== also) { ops.push({ path: "cards/" + id, data: Object.assign({}, cur, { cue: cue, point: point, also: also }) }); sum.cardsChanged++; lines.push("Edited: " + title + ", point " + n); }
    });
    return { ops: ops, lines: lines, sum: sum };
  }
  function startSync() {
    if (S.syncing) return;
    if (!S.db) return toast("Your library is still loading.");
    S.syncing = true; render();
    Promise.all([readRange("Books", "A1:K1000"), readRange("Cards", "A1:I6000")]).then(function (v) {
      S.syncing = false; render();
      if (!v[0].length || !v[1].length) return sheet(syncSheetHtml(null, "The Sheet came back empty. Check the Books and Cards tabs are still there."));
      S.syncPlan = computeSync(v[0], v[1]);
      sheet(syncSheetHtml(S.syncPlan));
    }).catch(function (e) {
      S.syncing = false; render();
      sheet(syncSheetHtml(null, syncError(e)));
    });
  }
  function syncSheetHtml(plan, err) {
    var head = '<div class="row"><b class="grow">Sync from Sheet</b><button class="iconbtn" data-act="closesheet" aria-label="Close">' + ICON.close + "</button></div>";
    if (err) return head + '<p class="muted" style="margin:0">' + esc(err) + "</p>";
    var s = plan.sum, total = s.booksNew + s.booksChanged + s.cardsNew + s.cardsChanged + s.cardsDropped;
    if (!total) return head + '<p class="muted" style="margin:0">Everything already matches your Sheet.</p>' + (s.skipped ? '<p class="small muted" style="margin:0">' + plural(s.skipped, "card") + " skipped because its book title isn't on the Books tab.</p>" : "");
    var parts = [];
    if (s.cardsChanged) parts.push(plural(s.cardsChanged, "edited card"));
    if (s.cardsNew) parts.push(plural(s.cardsNew, "new card"));
    if (s.cardsDropped) parts.push(plural(s.cardsDropped, "card") + " to remove");
    if (s.booksNew) parts.push(plural(s.booksNew, "new book"));
    if (s.booksChanged) parts.push(plural(s.booksChanged, "book") + " updated");
    return head + '<p style="margin:0">' + esc(parts.join(", ")) + ".</p>" +
      '<div class="small muted" style="display:flex;flex-direction:column;gap:4px;max-height:220px;overflow:auto">' + plan.lines.slice(0, 40).map(function (l) { return "<div>" + esc(l) + "</div>"; }).join("") + (plan.lines.length > 40 ? "<div>and " + (plan.lines.length - 40) + " more</div>" : "") + "</div>" +
      (s.skipped ? '<p class="small muted" style="margin:0">' + plural(s.skipped, "card") + " skipped because its book title isn't on the Books tab.</p>" : "") +
      '<p class="small muted" style="margin:0">Your review progress stays as it is. Removed cards lose their progress.</p>' +
      '<button class="btn btn-green" data-act="syncapply">Apply changes</button>';
  }
  function applySync() {
    var plan = S.syncPlan; if (!plan || !S.db) return;
    S.syncPlan = null; closeSheet(); toast("Syncing…");
    var ops = plan.ops.slice(), fails = 0;
    function worker() {
      var op = ops.shift(); if (!op) return Promise.resolve();

  }
  function openComing() {
    var list = booksSorted().filter(function (b) { return !cardsOf(b.id).length; });
    sheet('<div class="row"><b class="grow">Waiting for cards</b><button class="iconbtn" data-act="closesheet" aria-label="Close">' + ICON.close + '</button></div><p class="small muted" style="margin:0">In learning order. Cards are added here as they are written.</p><div style="display:flex;flex-direction:column;gap:2px;max-height:60vh;overflow:auto">' +
      list.map(function (b) { return '<button class="jrow" data-book="' + esc(b.id) + '"><span class="small muted num" style="min-width:30px">' + bookNo(b) + '</span><span class="grow" style="display:flex;flex-direction:column;min-width:0"><span style="font-family:var(--display);font-size:15px">' + esc(b.title) + '</span><span class="small muted">' + esc(b.author || "") + "</span></span></button>"; }).join("") + "</div>");
  }
  function openBookMenu(id) {
    var b = S.books[id]; if (!b) return;
    sheet('<div class="row"><b class="grow">' + esc(b.title) + '</b><button class="iconbtn" data-act="closesheet" aria-label="Close">' + ICON.close + '</button></div><button class="btn btn-outline" data-act="move" data-where="next" data-book="' + esc(id) + '">Learn this book next</button><button class="btn btn-outline" data-act="move" data-where="end" data-book="' + esc(id) + '">Move to the end of my queue</button>');
  }

  /* ---------- Events ---------- */
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-tab],[data-act],[data-book]");
    if (!t) { if (ev.target.id === "sheet") closeSheet(); return; }
    if (t.dataset.tab) { S.tab = t.dataset.tab; S.openBook = null; render(); window.scrollTo(0, 0); return; }
    var a = t.dataset.act;
    if (!a && t.dataset.book) { closeSheet(); S.tab = "library"; S.openBook = t.dataset.book; render(); window.scrollTo(0, 0); return; }
    if (a === "start") startSession("all");
    else if (a === "seen") markSeen();
    else if (a === "warmup") startSession("list", { list: [t.dataset.card] });
    else if (a === "reviewbook") startSession("list", { list: cardsOf(t.dataset.book).filter(function (c) { return S.progress[c.id]; }).sort(function (x, y) { return S.progress[x.id].due - S.progress[y.id].due; }).map(function (c) { return c.id; }) });
    else if (a === "learnnext") reorder(t.dataset.book, "next");
    else if (a === "reveal") { session.revealed = true; renderSession(); var f = document.getElementById("flash"); if (f) f.focus(); }
    else if (a === "grade") grade(Number(t.dataset.g));
    else if (a === "end") closeSession();
    else if (a === "star") { var c = S.cards[t.dataset.card]; c.starred = !c.starred; save("cards/" + c.id, Object.assign({}, c)); renderSession(); }
    else if (a === "back") { S.openBook = null; render(); }
    else if (a === "search") { S.search = S.search === null ? "" : null; render(); var q = document.getElementById("q"); if (q) q.focus(); }
    else if (a === "filter") { S.libFilter = t.dataset.f; render(); }
    else if (a === "mode") { captureAdd(); S.addMode = t.dataset.mode; render(); }
    else if (a === "morepoint") { captureAdd(); S.addPoints.push({}); render(); var el = document.getElementById("c" + (S.addPoints.length - 1)); if (el) el.focus(); }
    else if (a === "addpoint") { S.tab = "add"; S.addMode = "point"; S.addFor = t.dataset.book; S["f-book"] = t.dataset.book; S.addPoints = [{}]; S.openBook = null; render(); window.scrollTo(0, 0); }
    else if (a === "bookmenu") openBookMenu(t.dataset.book);
    else if (a === "move") { closeSheet(); reorder(t.dataset.book, t.dataset.where); }
    else if (a === "edit") openEdit(t.dataset.card);
    else if (a === "closesheet") closeSheet();
    else if (a === "sync") startSync();
    else if (a === "syncapply") applySync();
    else if (a === "showcoming") openComing();
    else if (a === "learnnow") learnNow(t.dataset.book);
    else if (a === "addfromsearch") { S.tab = "add"; S.addMode = "book"; S["f-title"] = (S.search || "").trim(); S["f-author"] = ""; S.addPoints = [{}]; S.when = "next"; S.search = ""; render(); window.scrollTo(0, 0); var ft = document.getElementById("f-author"); if (ft) ft.focus(); }
  });
  document.addEventListener("input", function (ev) { if (ev.target.id === "q") { S.search = ev.target.value; render(); } });
  document.addEventListener("change", function (ev) { if (ev.target.id === "f-book") { captureAdd(); render(); } });
  document.addEventListener("keydown", function (ev) {
    if (!session || document.getElementById("sheet")) return;
    if (ev.target.matches && ev.target.matches("input, textarea, select")) return;
    if (session.isNew && (ev.key === " " || ev.key === "Enter" || ev.key === "ArrowRight")) { ev.preventDefault(); markSeen(); }
    else if (session.current && !session.isNew && !session.revealed && (ev.key === " " || ev.key === "Enter")) { ev.preventDefault(); session.revealed = true; renderSession(); }
    else if (session.revealed && (ev.key === "1" || ev.key === "ArrowLeft")) grade(1);
    else if (session.revealed && (ev.key === "2" || ev.key === "ArrowRight")) grade(3);
    else if (ev.key === "Escape") closeSession();
  });
  document.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var f = ev.target, val = function (id) { var el = document.getElementById(id); return el ? el.value.trim() : ""; };
    if (f.id === "editform") {
      var c = S.cards[f.dataset.card], cue = val("e-cue"), point = val("e-point"); if (!cue || !point) return;
      Object.assign(c, { cue: cue, point: point, also: val("e-also") }); save("cards/" + c.id, Object.assign({}, c)).then(function () { toast("Point updated"); });

    }
    if (f.id !== "addform") return;
    captureAdd();
    var pts = S.addPoints.map(function (p) { return { cue: (p.cue || "").trim(), point: (p.point || "").trim(), also: (p.also || "").trim() }; }).filter(function (p) { return p.cue && p.point; });
    var bookId;
    if (S.addMode === "book") {
      var title = (S["f-title"] || "").trim(); if (!title) return;
      bookId = slug(title); if (S.books[bookId]) bookId += "-" + Math.random().toString(36).slice(2, 6);
      var bs = booksSorted(), order;
      if (S.when === "next") { var cb = currentBook(), after = cb ? bs.filter(function (x) { return x.order > cb.order; })[0] : null; order = cb ? (after ? (cb.order + after.order) / 2 : cb.order + 1) : (bs.length ? bs[0].order - 1 : 1); }
      else order = bs.length ? bs[bs.length - 1].order + 1 : 1;
      var book = { id: bookId, title: title, author: (S["f-author"] || "").trim(), category: "", order: order, custom: true, addedAt: Date.now() };
      S.books[bookId] = book; save("books/" + bookId, book);
    } else { bookId = S["f-book"] || S.addFor; if (!bookId || !pts.length) return; }
    var n = cardsOf(bookId).reduce(function (m, c) { return Math.max(m, c.n); }, 0);
    pts.forEach(function (p) { n++; var cid = bookId + "-" + String(n).padStart(2, "0"); var card = { id: cid, bookId: bookId, n: n, cue: p.cue, point: p.point, also: p.also, custom: true }; S.cards[cid] = card; save("cards/" + cid, card); });
    toast(S.addMode === "book" ? "Book added" : plural(pts.length, "point") + " added");
    S.addPoints = [{}]; S["f-title"] = ""; S["f-author"] = ""; S.when = "end";
    S.tab = "library"; S.openBook = bookId; render(); window.scrollTo(0, 0);
  });

  /* Keep "X to review" true to the minute while the app is open. */
  function tick() {
    if (!S.ready || document.hidden) return;
    if (session) { if (session.current && session.mode !== "list") { var top = overlay.querySelector(".rvtop .num"), n = dueQueue(Date.now(), session.bookId).length; if (top) top.textContent = n ? n + " to review" : "Nothing due"; } return; }
    if (S.tab === "today" && !document.getElementById("sheet")) render();
  }

  document.addEventListener("visibilitychange", function () { if (!document.hidden) tick(); });

  /* ---------- Phone app extras: backup, install prompt, Android back button, offline cache ---------- */
  var NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  var PLUG = (window.Capacitor && window.Capacitor.Plugins) || {};
  var STANDALONE = NATIVE || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
  var IOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var installEvt = null, installHidden = false;
  try { installHidden = localStorage.getItem("bookly-install-hidden") === "1"; } catch (e) {}
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); installEvt = e; if (S.tab === "today") render(); });
  window.addEventListener("appinstalled", function () { installEvt = null; installHidden = true; render(); });

  function installBanner() {
    if (STANDALONE || installHidden || (!IOS && !installEvt)) return "";
    var how = IOS ? "In Safari, tap the Share button, then <b>Add to Home Screen</b>. Bookly then opens full screen and works offline." : "Install it to open Bookly from your home screen, full screen and offline.";
    var apk = "", gh = location.hostname.match(/^([^.]+)\.github\.io$/), repo = location.pathname.split("/")[1];
    if (/android/i.test(navigator.userAgent) && gh && repo) apk = '<a class="small" style="color:var(--soft);font-weight:600;text-align:center" href="https://github.com/' + gh[1] + "/" + repo + '/releases/latest/download/Bookly.apk">Or download the Android app (APK)</a>';
    return '<section class="glass" style="gap:10px;padding:14px 16px"><div class="row" style="align-items:flex-start"><img src="icons/icon-192.png" alt="" width="40" height="40" style="border-radius:10px"><div class="grow small" style="color:var(--fg-warm)"><b style="font-size:15px">Put Bookly on your home screen</b><br>' + how + '</div><button class="iconbtn" data-act="hideinstall" aria-label="Hide">' + ICON.close + "</button></div>" +
      (installEvt ? '<button class="btn-soft" data-act="install">Install Bookly</button>' : "") + apk + "</section>";
  }
  function backupPanel() {
    return '<section class="panel"><div class="row" style="gap:12px;flex-wrap:wrap"><span class="grow" style="display:flex;flex-direction:column;gap:2px;min-width:160px"><span class="small" style="font-weight:600">Backup</span><span class="small muted" style="font-size:12px">Your progress lives on this phone. Save a copy now and then.</span></span>' +
      '<span class="row" style="gap:8px"><button class="btn btn-outline" data-act="backup" style="min-height:44px">Save</button><button class="btn btn-outline" data-act="restore" style="min-height:44px">Restore</button></span></div></section>';
  }
  function backupData() { return { name: "bookly-backup-" + dayKey(Date.now()) + ".json", text: JSON.stringify({ app: "bookly", at: Date.now(), docs: S.db.dump() }) }; }
  function saveBackup() {
    if (!S.db) return;
    var b = backupData();
    if (NATIVE && PLUG.Filesystem && PLUG.Share) {
      return PLUG.Filesystem.writeFile({ path: b.name, data: b.text, directory: "CACHE", encoding: "utf8" })
        .then(function (r) { return PLUG.Share.share({ title: "Bookly backup", url: r.uri, dialogTitle: "Save your Bookly backup" }); })
        .catch(function (e) { if (!/cancel/i.test(String(e && e.message))) toast("Couldn't save the backup."); });
    }
    var file = null; try { file = new File([b.text], b.name, { type: "application/json" }); } catch (e) {}
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) return navigator.share({ files: [file], title: "Bookly backup" }).catch(function () {});
    var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([b.text], { type: "application/json" })); a.download = b.name;
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    toast("Backup saved to your downloads");
  }
  function pickRestore() {
    var i = document.createElement("input"); i.type = "file"; i.accept = "application/json,.json";
    i.onchange = function () {
      var f = i.files && i.files[0]; if (!f) return;
      f.text().then(function (t) {
        var j = JSON.parse(t); if (!j || j.app !== "bookly" || !j.docs) throw 0;
        if (!confirm("Replace everything in Bookly with this backup from " + new Date(j.at).toLocaleDateString("en-GB") + "?")) return;
        return S.db.restore(j.docs).then(function () { toast("Backup restored"); });
      }).catch(function () { toast("That file isn't a Bookly backup"); });
    };
    i.click();
  }
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-act]"); if (!t) return;
    var a = t.dataset.act;
    if (a === "backup") saveBackup();
    else if (a === "restore") pickRestore();
    else if (a === "install" && installEvt) { installEvt.prompt(); installEvt.userChoice.then(function () { installEvt = null; render(); }); }
    else if (a === "hideinstall") { installHidden = true; try { localStorage.setItem("bookly-install-hidden", "1"); } catch (e) {} render(); }
  });
  if (NATIVE && PLUG.App) {
    PLUG.App.addListener("backButton", function () {
      if (document.getElementById("sheet")) return closeSheet();
      if (session) return closeSession();
      if (S.openBook) { S.openBook = null; return render(); }
      if (S.tab !== "today") { S.tab = "today"; render(); return window.scrollTo(0, 0); }
      PLUG.App.exitApp();
    });
  }
  if (!NATIVE && "serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }

  /* ---------- Boot ---------- */
  render();
  function loaded(k) { S.loaded[k] = true; if (S.loaded.books && S.loaded.cards && S.loaded.progress) S.ready = true; render(); }
  function sub(col) {
    S.db.collection(col).onSnapshot(function (snap) {
      var m = {}; snap.docs.forEach(function (d) { var v = Object.assign({}, d.data()); if (!v.id) v.id = d.id; m[d.id] = v; });
      S[col] = m; loaded(col);
    }, function () { S.offline = true; render(); });
  }
  var use = window.BooklyDB;
  Promise.resolve(use).then(function (db) {
    if (!db) { S.offline = true; render(); return; }
    S.db = db; sub("books"); sub("cards"); sub("progress");
    db.doc("meta/sync").onSnapshot(function (d) { if (d.exists) S.sync = Object.assign({}, d.data()); if (S.ready && S.tab === "progress") render(); });
  }).catch(function () { S.offline = true; render(); });
})();
</script>
